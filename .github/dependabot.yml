version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directories: ["/", "/action/setup"]
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly }
