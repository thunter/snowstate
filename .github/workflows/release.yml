name: release
on:
  push: { tags: ['v*.*.*'] }

permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign signatures

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - id: version
        run: .github/scripts/release-version.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: make release VERSION="$GITHUB_REF_NAME"
      - uses: sigstore/cosign-installer@v3
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--generate-notes)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
      - uses: docker/setup-buildx-action@v4
      - name: Publish the image
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          args="--push --tag $image:$GITHUB_REF_NAME"
          if [ "$PRERELEASE" != "true" ]; then args="$args --tag $image:$MAJOR"; fi
          make image-multiarch VERSION="$GITHUB_REF_NAME" IMAGE_ARGS="$args"
      - name: Move the major tag for action/setup
        if: steps.version.outputs.prerelease != 'true'
        env:
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git tag -f "$MAJOR"
          git push -f origin "refs/tags/$MAJOR"
