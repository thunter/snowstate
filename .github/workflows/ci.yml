name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v8
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make test
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make vuln
  e2e:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/e2e/tools.sh') }}
      - run: make e2e
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make release
      - uses: actions/upload-artifact@v4
        with: { name: binaries, path: dist/, retention-days: 3 }
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make image VERSION=ci
      - name: Runs as non-root on a read-only filesystem
        run: |
          test "$(docker inspect -f '{{.Config.User}}' snowstate:ci)" = "65532:65532"
          docker run --rm --read-only snowstate:ci version
      - uses: docker/setup-buildx-action@v3
      - name: Builds for every image platform
        run: make image-multiarch VERSION=ci
  integration:
    # Needs a real Snowflake account, so it shows as skipped, not passed, until
    # the SNOWFLAKE_* variables and the SNOWFLAKE_PRIVATE_KEY secret are set.
    if: vars.SNOWFLAKE_ACCOUNT != '' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      SNOWSTATE_IT_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWSTATE_IT_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWSTATE_IT_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWSTATE_IT_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWSTATE_IT_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWSTATE_IT_AUTH: keypair
      SNOWSTATE_IT_PRIVATE_KEY_PATH: ${{ github.workspace }}/.it-key.p8
      SNOWSTATE_IT_ROLE_A: ${{ vars.SNOWFLAKE_ROLE_A }}
      SNOWSTATE_IT_ROLE_B: ${{ vars.SNOWFLAKE_ROLE_B }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: printf '%s' "$KEY" > .it-key.p8 && chmod 600 .it-key.p8
        env: { KEY: "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" }
      - run: make tools integration
  github-wif:
    # Dogfoods the recommended setup: real Snowflake through GitHub OIDC. It needs
    # the OIDC user from dev_setup.md and the `integration` environment.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: integration
    permissions: { contents: read, id-token: write }
    env:
      SNOWSTATE_IT_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWSTATE_IT_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWSTATE_IT_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWSTATE_IT_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWSTATE_IT_AUTH: workload_identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make tools
      - run: go test -count=1 -timeout 30m -tags integration -run 'TestE2EOverSnowflake|TestSplitPlanApplyOverSnowflake' ./test/integration/...
